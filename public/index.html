<script>

   - Para ocultar un botón: dejar el dato vacío  ""

   - whatsapp: formato 549 + característica sin 0 + número sin 15.

   - mensajeWhatsApp: {sucursal} se reemplaza por el nombre de la sucursal.
     Ejemplo: 5493511234567

   - domingo: horario de domingo de esa sucursal (ej. "de 10 a 14hs"),

<style>
  :root {
    --bg: #111111;
    --card: #1c1c1c;
    --card-border: #2c2c2c;
    --text: #f2f2f2;
    --muted: #a3a3a3;
    --gold: #fe9900;
    --btn: #262626;
    --btn-hover: #333333;
    --off: #5a5a5a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }
  main { width: 100%; max-width: 440px; padding: 32px 16px 40px; }

  header { text-align: center; margin-bottom: 28px; }
  .logo { width: 100%; max-width: 300px; height: auto; display: block; margin: 0 auto; }
  .info { margin-top: 18px; font-size: 14px; color: var(--muted); line-height: 1.6; }
  .info strong { color: var(--gold); font-weight: 600; }

  .sucursal {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 14px 14px;
    margin-bottom: 18px;
  }
  .sucursal h2 { font-size: 16px; font-weight: 700; text-transform: uppercase; letter-spacing: .3px; line-height: 1.3; }
  .dir { font-size: 13px; font-weight: 400; color: var(--muted); text-transform: none; letter-spacing: 0; margin-left: 6px; }
  /* Horarios: Lun a Sáb en texto; el domingo resaltado como etiqueta a la derecha */
  .horario { font-size: 12px; margin-top: 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .semana { color: #e6e6e6; }
  .semana .dias { color: var(--muted); }
  .dom {
    font-size: 11.5px; white-space: nowrap; padding: 3px 10px; border-radius: 999px;
    color: var(--gold); background: rgba(254,153,0,.12); border: 1px solid rgba(254,153,0,.4);
  }
  .dom b { font-weight: 700; }
  .dom.cerrado { color: #8a8a8a; background: #232323; border-color: #333333; }
  .botones { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 22px; }
  .botones a {
    display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 5px;
    background: var(--btn); color: var(--text); text-decoration: none;
    border-radius: 10px; padding: 10px 4px; font-size: 11px; font-weight: 600;
    transition: background .15s;
  }
  .botones a:hover { background: var(--btn-hover); }
  .botones svg { width: 14px; height: 14px; flex-shrink: 0; color: var(--gold); }
  .botones a.pendiente { color: var(--off); pointer-events: none; }
  .botones a.pendiente svg { color: var(--off); }

  .extras { margin-top: 8px; display: grid; gap: 10px; }
  .extras a {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    border: 1px solid var(--gold); color: var(--text); text-decoration: none;
    border-radius: 12px; padding: 13px; font-size: 14px; font-weight: 600;
    transition: background .15s;
  }
  .extras a:hover { background: var(--btn); }
  .extras svg { width: 16px; height: 16px; color: var(--gold); }

  footer { text-align: center; font-size: 11px; color: var(--off); margin-top: 24px; }

  /* Pantallas grandes: la misma página en columnas y todo agrandado en proporción
     (zoom), así letras, tarjetas y espacios crecen juntos. En el celular no cambia nada. */
  @media (min-width: 720px) {
    body { align-items: center; }   /* contenido centrado en alto: sin negro de sobra abajo */
    main { zoom: 1.12; max-width: 700px; padding: 32px 16px; }
    .botones a { white-space: nowrap; }
    #lista { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
    #lista .sucursal { margin-bottom: 0; display: flex; flex-direction: column; }
    #lista .botones { margin-top: auto; padding-top: 22px; }
    .extras { max-width: 360px; margin: 28px auto 0; }
    .logo { max-width: 300px; }
  }
  @media (min-width: 1100px) {
    main { zoom: 1.25; max-width: 1060px; }
    #lista { grid-template-columns: repeat(3, 1fr); gap: 20px; }
    main { padding-top: 56px; }
    .logo { max-width: 420px; }
    header { margin-bottom: 36px; }
  }
  /* Monitores grandes: se agranda más para ocupar la pantalla */
  @media (min-width: 1600px) and (min-height: 950px) {
    main { zoom: 1.45; }
  }
  @media (min-width: 2200px) and (min-height: 1250px) {
    main { zoom: 1.9; }
  }
</style>
</head>
<body>
<main>
  <header>
    <img class="logo" src="logo.png" alt="Buena Vibra Barbería">
    <p class="info"><strong id="aviso"></strong></p>
  </header>

  <section id="lista"></section>
  <section id="extras" class="extras"></section>

  <footer>Buena Vibra Barbería · Córdoba</footer>
</main>

<script>
const ICONOS = {
  whatsapp: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8.5 8.5 0 0 1-12.6 7.4L3 21l1.6-5.2A8.5 8.5 0 1 1 21 12z"/></svg>',
  mapa: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
  resena: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9L12 3z"/></svg>'
};

function boton(tipo, valor, texto, sucursal) {
  if (!valor) return "";                       // vacío = no se muestra
  if (valor === "PENDIENTE") {
    return `<a class="pendiente" aria-disabled="true">${ICONOS[tipo]}${texto}</a>`;
  }
  let url = valor;
  if (tipo === "whatsapp") {
    url = `https://wa.me/${valor}?text=${encodeURIComponent(CONFIG.mensajeWhatsApp.replace("{sucursal}", sucursal))}`;
  }
  return `<a href="${url}" target="_blank" rel="noopener" data-umami-event="${texto}" data-umami-event-sucursal="${sucursal}">${ICONOS[tipo]}${texto}</a>`;
}

document.getElementById("aviso").textContent = CONFIG.aviso;

document.getElementById("lista").innerHTML = SUCURSALES.map(s => `
  <article class="sucursal">
    <h2>${s.nombre}${s.direccion ? `<span class="dir">${s.direccion}</span>` : ""}</h2>
    <p class="horario"><span class="semana"><span class="dias">${CONFIG.horarioSemanaDias}</span> ${CONFIG.horarioSemanaHoras}</span>${s.domingo ? (s.domingo === "cerrado" ? `<span class="dom cerrado"><b>Dom</b> Cerrado</span>` : `<span class="dom"><b>Dom</b> ${s.domingo}</span>`) : ""}</p>
    <div class="botones">
      ${boton("whatsapp", s.whatsapp, "WhatsApp", s.nombre)}
      ${boton("mapa", s.mapa, "Cómo llegar", s.nombre)}
      ${boton("resena", s.resena, "Dejar reseña", s.nombre)}
    </div>
  </article>
`).join("");

const ICONO_EXTRA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/></svg>';
document.getElementById("extras").innerHTML = (CONFIG.botonesExtra || []).map(b =>
  `<a href="${b.url}" target="_blank" rel="noopener" data-umami-event="${b.texto}">${ICONO_EXTRA}${b.texto}</a>`
).join("");
</script>
</body>
</html>
